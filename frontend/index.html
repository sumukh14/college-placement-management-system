<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect | College Placement & Career Management</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top right, #eef2ff, #f4f7fc);
      padding: 20px;
    }
    .landing-card {
      background: #ffffff;
      padding: 48px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
      max-width: 520px;
      width: 100%;
      border: 1px solid var(--line);
    }
    .landing-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .landing-brand .brand-mark {
      width: 46px;
      height: 46px;
      font-size: 16px;
    }
    .landing-brand span.title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      color: var(--ink);
    }
    h1 {
      font-size: 22px;
      color: var(--ink);
      font-weight: 700;
      margin-bottom: 10px;
    }
    p.subtext {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      display: block;
      padding: 14px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .btn-student {
      background: linear-gradient(135deg, #315be8, #18b8b0);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(49, 91, 232, 0.25);
    }
    .btn-student:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-admin {
      background: #f8fafc;
      color: var(--ink);
      border: 1px solid var(--border-color);
    }
    .btn-admin:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="landing-card">
    <div class="landing-brand">
      <div class="brand-mark">CC</div>
      <span class="title">CampusConnect</span>
    </div>
    <h1>College Placement & Career Portal</h1>
    <p class="subtext">Empowering students and campus recruiters with seamless placement management.</p>
    <div class="btn-group">
      <a href="student/login.html" class="btn btn-student">Student Portal Login</a>
      <a href="admin/admin-login.html" class="btn btn-admin">Admin / Placement Officer Login</a>
    </div>
    <div class="footer-note">CampusConnect Placement Season 2026–27</div>
  </div>
</body>
</html>
