<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/f1-style.css">
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    
</head>
<body>
    <div class="container">
        <div class="login-brand">
            <div class="brand-mark admin-mark">CC</div>
            <h2>CampusConnect <span class="badge-role">Admin</span></h2>
            <p>Staff & Placement Officer Login</p>
        </div>

       <form action="admin-dashboard.html">
            <div class="form-group">
                <label for="staffId">Email:</label>
                <input type="email" placeholder="Enter your email"
                        pattern=`^[A-Za-z0-9._%+-]+@(gmail\.com|yahoo\.com|outlook\.com|hotmail\.com)$`
                        title="Please enter a valid Gmail, Yahoo, Outlook or Hotmail address"
                        required>
            </div>

           <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Min 8 chars (e.g. Pass@123)" required>
                <small style="display:block; color:#6B7280; font-size:11px; margin-top:4px;">
                    Must contain letters, numbers & special character
                </small>
            </div>

            <button type="submit">Login</button>
        </form>

        <p class="login-note">Use your staff ID or registered email to continue.</p>

        <p class="admin-login-link">
            Student?
            <a href="../student/login.html">Login here</a>
        </p>

        <div style="text-align: center;">
            <a href="../index.html" class="back-home">← Back to Portal Home</a>
        </div>
    </div>
</body>
</html>
