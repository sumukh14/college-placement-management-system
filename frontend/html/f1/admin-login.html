<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="brand">
            <h1>College Placement Portal</h1>
            <p>Staff / Admin Login</p>
        </div>

        <form>
            <div class="form-group">
                <label for="staffId">Staff ID / Email:</label>
                <input type="text" id="staffId" placeholder="Enter Staff ID or Email" required>
            </div>

            <div class="form-group">
                <label for="adminPassword">Password:</label>
                <input type="password" id="adminPassword" placeholder="Enter your password" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <p class="login-note">Use your staff ID or registered email to continue.</p>
    </div>
</body>
</html>
