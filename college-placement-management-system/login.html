<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="container">
    <div class="brand">
      <h1>Placement portal</h1>
      <p>Student Login</p>
    </div>
    <form action="dashboard.html">
      
    <div class="form-group">
    <label for="studentName">Student Name:</label>
    <input type="text" id="studentName" placeholder="Enter your name" required>
    </div>
      <div class="form-group">
      <label for="rollNo">Roll No.:</label>
      <input type="number" placeholder="Enter your roll number" id="rollNo" required>
      </div>
      <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" placeholder="Enter your password" id="password" required>
      </div>
      <button type="submit" id="loginButton">Login</button>
    </form>
    <p class="login-note">Use your college roll number and password to continue.</p>
    <p class="admin-login-link">
    Staff/Admin?
    <a href="admin-login.html">Login here</a>
  </p>
  </div>
</body>

</html>
