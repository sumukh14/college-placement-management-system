<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="admin-script.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>
  <div class="container">
    <div class="brand">
      <h1>Placement Portal</h1>
      <p>Admin Login</p>
    </div>
    
      <div class="form-group">
        <label for="staffId">Staff ID / Email:</label>
        <input type="text" id="staffId" placeholder="Enter Staff ID or Email" required>

      </div>
      <div class="form-group">
        <label for="adminPassword">Password:</label>
        <input type="password" id="adminPassword" placeholder="Enter your password" required>
      </div>
      <button type="submit" id="adminLoginButton">Login</button>
    </form>
    <form>
      <p class="login-note">
    Use your staff ID or registered email to continue.
      </p>
  </div>
</body>

</html>
